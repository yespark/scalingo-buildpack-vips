name: Build and Release libvips

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  pull_request:
  workflow_dispatch:
    inputs:
      vips_version:
        description: 'libvips version to build (e.g. 8.18.0). Leave empty for latest.'
        required: false
      overwrite:
        description: 'Delete existing release and rebuild'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Determine vips version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.vips_version }}" ]; then
            VERSION="${{ github.event.inputs.vips_version }}"
          else
            VERSION=$(curl --fail --silent --show-error \
              https://api.github.com/repos/libvips/libvips/releases/latest \
              | grep '"tag_name":' \
              | sed -E 's/.*"v([^"]+)".*/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine libvips version" >&2
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION '${VERSION}' is not a stable release (got pre-release or invalid format)" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved libvips version: ${VERSION}"

      - name: Check if release already exists
        id: check_release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OVERWRITE="${{ github.event.inputs.overwrite }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # A pull request never releases: it only has to prove both stacks build.
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$OVERWRITE" = "true" ]; then
              echo "Release ${TAG} exists — overwrite requested, deleting."
              gh release delete "$TAG" --yes --cleanup-tag
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release ${TAG} already exists, skipping."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build:
    needs: resolve
    if: github.event_name == 'pull_request' || needs.resolve.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [scalingo-24, scalingo-26]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Test
        run: |
          chmod +x build.sh
          STACK="${{ matrix.stack }}" VIPS_VERSION="${{ needs.resolve.outputs.version }}" ./build.sh

      # The config log is the only place where a lost format loader shows up:
      # a missing SVG or magick loader keeps the build green.
      - name: Show enabled loaders
        run: cat "build/configurations/${{ matrix.stack }}.config.log"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.stack }}
          path: |
            build/${{ matrix.stack }}.tar.bz2
            build/configurations/${{ matrix.stack }}.config.log
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [resolve, build]
    if: github.event_name != 'pull_request' && needs.resolve.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Download stack artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: build

      # Compatibility alias for buildpack refs older than the multi-stack split,
      # whose bin/compile only knows the unsuffixed name (yespark-rails pins
      # #v8.18.4). Drop it once every app pins a ref that resolves per stack.
      - name: Add legacy scalingo-24 alias
        run: cp build/scalingo-24.tar.bz2 build/scalingo.tar.bz2

      - name: Create GitHub Release
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          gh release create "$TAG" \
            --title "libvips ${VERSION} for scalingo-24 and scalingo-26" \
            --notes "Pre-compiled libvips ${VERSION}.

          - \`scalingo-24.tar.bz2\` — Ubuntu 24.04 stack
          - \`scalingo-26.tar.bz2\` — Ubuntu 26.04 stack
          - \`scalingo.tar.bz2\` — deprecated alias of the scalingo-24 tarball, kept for buildpack refs older than the multi-stack split

          A tarball is tied to the stack it was built on: it only bundles the shared libraries missing from that base image." \
            build/scalingo-24.tar.bz2 \
            build/scalingo-26.tar.bz2 \
            build/scalingo.tar.bz2 \
            build/configurations/scalingo-24.config.log \
            build/configurations/scalingo-26.config.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
