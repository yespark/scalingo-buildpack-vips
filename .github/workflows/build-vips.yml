name: Build and Release libvips

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch:
    inputs:
      vips_version:
        description: 'libvips version to build (e.g. 8.18.0). Leave empty for latest.'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine vips version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.vips_version }}" ]; then
            VERSION="${{ github.event.inputs.vips_version }}"
          else
            VERSION=$(curl -s https://api.github.com/repos/libvips/libvips/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved libvips version: ${VERSION}"

      - name: Check if release already exists
        id: check_release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test
        if: steps.check_release.outputs.exists == 'false'
        run: |
          chmod +x build.sh
          VIPS_VERSION="${{ steps.version.outputs.version }}" ./build.sh

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "libvips ${VERSION} for scalingo-24" \
            --notes "Pre-compiled libvips ${VERSION} for the scalingo-24 stack." \
            build/scalingo.tar.bz2 \
            build/configurations/scalingo.config.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
